version: '3.8'

services:
  app:
    build: .
    ports:
      - "80:80"
    environment:
      - MYSQLHOST=db
      - MYSQLDATABASE=tabdilat
      - MYSQLUSER=root
      - MYSQLPASSWORD=root
    depends_on:
      - db
    restart: always

  db:
    image: mariadb:10.6
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=tabdilat
    volumes:
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql
    restart: always

volumes:
  db_data:
